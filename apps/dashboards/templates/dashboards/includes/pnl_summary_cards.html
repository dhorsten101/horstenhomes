{% load money_extras %}
<div class="row row-cols-1 row-cols-md-3 g-3 mb-4">
  <div class="col">
    <div class="card crm-card crm-stat-card h-100 border-primary border-opacity-25">
      <div class="card-body">
        <div class="text-muted small text-uppercase">Invoices</div>
        <div class="fs-4 fw-semibold">{{ invoices_total|zar }}</div>
      </div>
    </div>
  </div>
  <div class="col">
    <div class="card crm-card crm-stat-card h-100 border-danger border-opacity-25">
      <div class="card-body">
        <div class="text-muted small text-uppercase">Expenses</div>
        <div class="fs-4 fw-semibold">{{ expenses_total|zar }}</div>
      </div>
    </div>
  </div>
  <div class="col">
    <div class="card crm-card crm-stat-card h-100 {% if net >= 0 %}border-success{% else %}border-warning{% endif %} border-opacity-50">
      <div class="card-body">
        <div class="text-muted small text-uppercase">Net (P&amp;L)</div>
        <div class="fs-4 fw-semibold">{{ net|zar }}</div>
      </div>
    </div>
  </div>
</div>
