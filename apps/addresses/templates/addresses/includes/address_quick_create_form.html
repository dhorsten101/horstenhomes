<form
  id="addressQuickCreateForm"
  method="post"
  data-address-quick-create="true"
  hx-post="{% url 'addresses:quick_create' %}"
  hx-swap="none"
>
  {% csrf_token %}
  <input type="hidden" name="field_id" value="{{ field_id }}">

  {% if form.non_field_errors %}
    <div class="alert alert-danger">{{ form.non_field_errors }}</div>
  {% endif %}

  <div class="row g-3">
    {% for field in form %}
      <div class="col-12">
        <label class="form-label" for="{{ field.id_for_label }}">
          {{ field.label }}
          {% if field.field.required %}<span class="text-danger" aria-hidden="true">*</span>{% endif %}
        </label>
        {{ field }}
        {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
        {% for err in field.errors %}<div class="text-danger small">{{ err }}</div>{% endfor %}
      </div>
    {% endfor %}
  </div>

  <div class="mt-4 d-flex flex-wrap gap-2">
    <button class="btn btn-primary" type="submit">Save address</button>
    <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancel</button>
  </div>
</form>
