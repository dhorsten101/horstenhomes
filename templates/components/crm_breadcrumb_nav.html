<div class="crm-page-nav mb-3">
  {% if parent_back %}
    <a href="{{ parent_back.url }}" class="crm-quick-back">
      <i class="bi bi-arrow-left" aria-hidden="true"></i>
      <span>{{ parent_back.label }}</span>
    </a>
  {% endif %}
  {% if items|length > 1 %}
    <nav aria-label="Breadcrumb">
      <ol class="breadcrumb crm-breadcrumb mb-0 flex-nowrap">
        {% for item in items %}
          {% if item.url %}
            <li class="breadcrumb-item"><a href="{{ item.url }}">{{ item.label }}</a></li>
          {% else %}
            <li class="breadcrumb-item active" aria-current="page">{{ item.label }}</li>
          {% endif %}
        {% endfor %}
      </ol>
    </nav>
  {% endif %}
</div>
