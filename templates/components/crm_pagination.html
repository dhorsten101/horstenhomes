{% if is_paginated %}
<nav class="mt-4" aria-label="Page navigation">
  <ul class="pagination justify-content-center mb-0">
    {% if page_obj.has_previous %}
      <li class="page-item">
        <a class="page-link" href="?{% if q %}q={{ q|urlencode }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">
          <i class="bi bi-chevron-left me-1" aria-hidden="true"></i>Previous
        </a>
      </li>
    {% else %}
      <li class="page-item disabled"><span class="page-link">Previous</span></li>
    {% endif %}

    <li class="page-item disabled">
      <span class="page-link">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    </li>

    {% if page_obj.has_next %}
      <li class="page-item">
        <a class="page-link" href="?{% if q %}q={{ q|urlencode }}&amp;{% endif %}page={{ page_obj.next_page_number }}">
          Next<i class="bi bi-chevron-right ms-1" aria-hidden="true"></i>
        </a>
      </li>
    {% else %}
      <li class="page-item disabled"><span class="page-link">Next</span></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
